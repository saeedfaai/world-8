name: entity-identity-contract-freeze-candidate

on:
  pull_request:
    paths:
      - 'architecture/proposals/world8-entity-identity-contract-freeze-candidate-v0.1.yaml'
      - 'architecture/proposals/WORLD8_ENTITY_IDENTITY_IMPLEMENTATION_INVENTORY_v0.1.md'
      - 'scripts/validate_entity_identity_contract_freeze_candidate.py'
      - 'tests/test_entity_identity_contract_freeze_candidate.py'
      - '.github/workflows/entity-identity-contract-freeze-candidate.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_entity_identity_contract_freeze_candidate.py
      - run: python -m unittest tests.test_entity_identity_contract_freeze_candidate -v
