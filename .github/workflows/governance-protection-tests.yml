name: governance-protection-tests

on:
  pull_request:
    paths:
      - 'supabase/drafts/20260829_world8_governance_protection_private_repos_v1.sql'
      - 'supabase/drafts/20260829_world8_merge_enqueue_v2_governance_protection_integration.sql'
      - 'supabase/drafts/20260829_world8_merge_queue_v2_governance_protection_integration.sql'
      - 'tests/test_governance_protection_private_repos_v1.py'
      - 'tests/test_merge_enqueue_v2_governance_protection_integration.py'
      - 'tests/test_merge_queue_v2_governance_protection_integration.py'
      - '.github/workflows/governance-protection-tests.yml'

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: >-
          python -m pytest -q
          tests/test_governance_protection_private_repos_v1.py
          tests/test_merge_enqueue_v2_governance_protection_integration.py
          tests/test_merge_queue_v2_governance_protection_integration.py
