name: KAREST AI Broker Edge Hardening Gate

on:
  push:
    branches:
      - proposal/karest-ai-broker-edge-hardening-v0-1
  pull_request:
    paths:
      - 'proposals/karest_ai_broker_impl_v0_1/**'
      - '.github/workflows/karest-ai-broker-edge-hardening-gate.yml'

jobs:
  hardening-source-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run non-vacuous Edge hardening source tests
        run: python -m unittest -v proposals/karest_ai_broker_impl_v0_1/test_edge_hardening_source.py
