name: probe-groq-secret

on:
  push:
    branches:
      - work/provider-failover-mesh-v0.1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - name: Check configured secret and Groq reachability
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GROQ_API_KEY:-}" ]; then
            echo "groq_secret_present=false"
            exit 2
          fi
          echo "groq_secret_present=true"
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer ${GROQ_API_KEY}" \
            https://api.groq.com/openai/v1/models)"
          echo "groq_models_http_status=${status}"
          test "${status}" = "200"
