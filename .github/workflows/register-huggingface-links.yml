name: Register Hugging Face Links

on:
  push:
    paths:
      - '.github/workflows/register-huggingface-links.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch EXTERNAL_LINKS append-only service registry
        shell: python
        run: |
          from pathlib import Path
          p=Path('EXTERNAL_LINKS.md')
          s=p.read_text(encoding='utf-8')
          old='| Hugging Face | — | NEEDS_VERIFICATION | Exact profile/org URL not yet verified |'
          new='| Hugging Face account | https://huggingface.co/Saeedfa | VERIFIED | Authenticated `whoami` confirmed username `Saeedfa`; public World 8 surfaces are published under this account |'
          if old in s:
              s=s.replace(old,new,1)
          marker='## World 8 canonical & continuity resources\n'
          section='''## Hugging Face — AI-native public surfaces\n\n| Surface | URL | Status | Note |\n|---|---|---|---|\n| World 8 Collection | https://huggingface.co/collections/Saeedfa/world-8-6a902b1a3a05b0ab39990265 | CURRENT / VERIFIED | Groups the current World 8 Hugging Face surfaces |\n| World 8 Core | https://huggingface.co/Saeedfa/world8-core | CURRENT / VERIFIED | Public AI-native mirror/presentation; GitHub remains canonical |\n| World 8 Forecast Hall | https://huggingface.co/Saeedfa/world8-forecast-hall | CURRENT / VERIFIED | Architecture/discovery surface; non-production |\n| World 8 Market Data | https://huggingface.co/Saeedfa/world8-market-data | CURRENT / VERIFIED | Architecture/discovery surface; non-production |\n| World 8 Demo Space | https://huggingface.co/spaces/Saeedfa/world8-demo | CURRENT / VERIFIED | Public Static Space; zero-compute initial demo |\n\nThe Hugging Face account is currently a personal account rather than a World 8 Organization. A future migration to an organization may be performed deliberately; historical URLs must not be silently erased from the registry.\n\n'''
          if '## Hugging Face — AI-native public surfaces' not in s:
              s=s.replace(marker,section+marker,1)
          p.write_text(s,encoding='utf-8')
      - name: Commit registry update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add EXTERNAL_LINKS.md
          git commit -m "docs: register verified Hugging Face World 8 surfaces" || exit 0
          git push
