name: Register Zenodo v0.1.0

on:
  push:
    paths:
      - '.github/workflows/register-zenodo-v0.1.0.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch canonical publication registries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          links=Path('EXTERNAL_LINKS.md')
          s=links.read_text()
          old='| World 8 / Z0-A Final Design Baseline | 2026-08-24 | https://zenodo.org/records/22085394 | https://doi.org/10.5281/zenodo.22085394 | — | Canonical implementation now continues in `saeedfaai/world-8` | CURRENT / VERIFIED |'
          hist='| World 8 / Z0-A Final Design Baseline | 2026-08-24 | https://zenodo.org/records/22085394 | https://doi.org/10.5281/zenodo.22085394 | — | Canonical implementation now continues in `saeedfaai/world-8` | HISTORICAL / VERIFIED |'
          new='| World 8 v0.1.0 / Foundation & Development Control Plane Baseline | 2026-08-27 | https://zenodo.org/records/22127650 | https://doi.org/10.5281/zenodo.22127650 | — | https://github.com/saeedfaai/world-8/releases/tag/V0.1.0 | CURRENT / VERIFIED |'
          if new not in s:
              if old in s:
                  s=s.replace(old, hist+'\n'+new)
              elif hist in s:
                  s=s.replace(hist, hist+'\n'+new)
              else:
                  raise SystemExit('Expected Z0-A lineage row not found')
          receipt='| World 8 v0.1.0 exact released commit | `b14f2feea0fa233851a774d6ebd295b63cde75c0` | CURRENT / VERIFIED |\n| World 8 v0.1.0 Zenodo publication receipt | https://github.com/saeedfaai/World-v6-public/blob/main/ops/zenodo/world8-v0.1.0-publication.json | CURRENT / VERIFIED_REFERENCE |\n| World 8 v0.1.0 Zenodo publication gate | https://github.com/saeedfaai/world-8/issues/9 | CURRENT / VERIFIED_REFERENCE |'
          anchor='| World 7 public review request | https://github.com/saeedfaai/World-v6-public/issues/19 | HISTORICAL / VERIFIED_REFERENCE |'
          if 'World 8 v0.1.0 exact released commit' not in s:
              if anchor not in s: raise SystemExit('Publication receipt anchor not found')
              s=s.replace(anchor, anchor+'\n'+receipt)
          links.write_text(s)

          mf=Path('distribution/huggingface/PUBLICATION_MANIFEST.yaml')
          m=mf.read_text()
          oldblock='zenodo:\n  current_world8_z0a_doi: https://doi.org/10.5281/zenodo.22085394\n  world8_v0_1_0_doi: PENDING'
          newblock='zenodo:\n  historical_world8_z0a_doi: https://doi.org/10.5281/zenodo.22085394\n  world8_v0_1_0_record: https://zenodo.org/records/22127650\n  world8_v0_1_0_doi: https://doi.org/10.5281/zenodo.22127650\n  status: CURRENT_VERIFIED'
          if oldblock in m:
              m=m.replace(oldblock,newblock)
          elif 'world8_v0_1_0_doi: https://doi.org/10.5281/zenodo.22127650' not in m:
              raise SystemExit('Unexpected Hugging Face manifest Zenodo block')
          mf.write_text(m)
          PY
      - name: Commit registry synchronization
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add EXTERNAL_LINKS.md distribution/huggingface/PUBLICATION_MANIFEST.yaml
          git commit -m 'publication: register Zenodo v0.1.0 DOI [skip ci]' || exit 0
          git pull --rebase origin main
          git push
