name: release-gate

on:
  push:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-release-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate architecture
        run: python scripts/validate_architecture.py

      - name: Validate Developer Admission
        run: python scripts/validate_developer_admission.py

      - name: Validate Identity and Authority
        run: python scripts/validate_identity_authority.py

      - name: Fail on high-confidence secret patterns
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude='release-gate.yml' '(sk-proj-[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' .; then
            echo 'High-confidence secret-like material detected.' >&2
            exit 1
          fi
          echo 'Secret-pattern scan PASS'
