name: SSRN Manuscript Final Sync v0.1

on:
  push:
    branches:
      - work/ssrn-market-replay-v0.1
    paths:
      - '.github/workflows/ssrn-manuscript-final-sync-v0.1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/ssrn-market-replay-v0.1
          fetch-depth: 0
      - name: Synchronize manuscript and final receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/ssrn/manuscript/WORLD8_SSRN_WORKING_PAPER_v0.1.md')
          s=p.read_text(encoding='utf-8')
          s=s.replace('ba6250ae71255a5cc9d55e7d06dd8d37d305eff0','917dd82ed87a3470acfdb9175905ec7c8727c096')
          s=s.replace('c799a36db30973713fd0dcb3cc5a20caf57e1326ec4e222df769769ba3165f37','100484ffba683111622377703e836728817fd6cbb45f53d62e45a5a3766ece70')
          base='Forecast Contract v2 binds test forecasts to SHA256 identifiers for the feature set, strategy set, replay code, extension code, experiment protocol, and exact normalized snapshot. The evidence pipeline generates result tables from machine-readable outputs rather than using hand-entered result values as the source of record.'
          lifecycle='Forecast Contract v3 is a deterministic lifecycle projection of the immutable v2 test forecasts. It changes no forecast probability or resolved target. CI validates 52,920 terminal RESOLVED contracts, with zero invalidated, expired, withdrawn, superseded, or integrity-failure records, and verifies temporal ordering, probability bounds, binary resolution targets, and raw immutability.'
          if lifecycle not in s:
              if base not in s: raise SystemExit('evidence paragraph anchor not found')
              s=s.replace(base,base+'\n\n'+lifecycle)
          p.write_text(s,encoding='utf-8')

          lines=[
            '# World 8 SSRN Working Paper v0.1 - Final Candidate Receipt',
            '',
            'Date: 2026-08-27',
            'Status: FINAL CANDIDATE / AUTHOR CLAIM REVIEW / NOT SUBMITTED',
            '',
            '## Scientific binding',
            '- software release: https://github.com/saeedfaai/world-8/releases/tag/V0.1.0',
            '- release commit: `b14f2feea0fa233851a774d6ebd295b63cde75c0`',
            '- Zenodo DOI: https://doi.org/10.5281/zenodo.22127650',
            '- frozen empirical evidence commit: `917dd82ed87a3470acfdb9175905ec7c8727c096`',
            '- deterministic evidence package SHA256: `100484ffba683111622377703e836728817fd6cbb45f53d62e45a5a3766ece70`',
            '- lifecycle integrity: PASS - 52,920 RESOLVED / 0 integrity failures',
            '',
            '## Rendered manuscript',
            '- PDF SHA256: `acee536968f1fb9e527469d2125600b03587ce2e5a211ffdfadb6fe85f24ba7a`',
            '- DOCX SHA256: `8de4a3bc137882181add32cb3884dc355e4fe77ca5d680bb60ae20fb1aa57a18`',
            '- Markdown source SHA256: `7a1f11cd3ee75d2f974f41bac5341367408fede2f75e3bbf16642902393a6c19`',
            '- pages: 9',
            '- PDF preflight: OPENABLE / NOT ENCRYPTED / NOT SCANNED',
            '- visual QA: PASS - all 9 rendered pages inspected; no clipping, overlap, broken tables, or broken glyphs observed',
            '',
            '## Drive archive',
            '- PDF: https://drive.google.com/file/d/15b2XrL8mqix6gBEnWXm6VTxtoCCgCi59/view',
            '- DOCX: https://drive.google.com/file/d/1tNIMdqCBJ6a8dRDR60TkccWCoF-8G4MM/view',
            '',
            '## Claim boundary',
            'Supported only for the frozen studies described in the manuscript. No claim of live-trading profitability, production readiness, universal cross-market superiority, causal architectural superiority, or autonomous market intelligence is permitted.',
            '',
            '## Remaining human gate',
            'The author must review and explicitly approve the final manuscript claims before SSRN submission. No SSRN submission has been performed by this workflow.',
          ]
          receipt=Path('docs/ssrn/manuscript/WORLD8_SSRN_WORKING_PAPER_v0.1_RECEIPT.md')
          receipt.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
      - name: Commit synchronized manuscript receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ssrn/manuscript/WORLD8_SSRN_WORKING_PAPER_v0.1.md docs/ssrn/manuscript/WORLD8_SSRN_WORKING_PAPER_v0.1_RECEIPT.md
          git commit -m 'publication: sync final SSRN manuscript receipts [skip ci]' || exit 0
          git pull --rebase origin work/ssrn-market-replay-v0.1
          git push origin HEAD:work/ssrn-market-replay-v0.1
