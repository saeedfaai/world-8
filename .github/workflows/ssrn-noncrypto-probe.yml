name: SSRN Non-Crypto Data Probe

on:
  push:
    branches:
      - work/ssrn-market-replay-v0.1
    paths:
      - 'experiments/ssrn_market_replay_v0_1/scripts/probe_yahoo.py'
      - '.github/workflows/ssrn-noncrypto-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/ssrn-market-replay-v0.1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install probe dependencies
        run: pip install --quiet requests
      - name: Probe Yahoo public daily ETF chart data
        working-directory: experiments/ssrn_market_replay_v0_1
        run: python scripts/probe_yahoo.py
      - name: Validate probe receipt
        working-directory: experiments/ssrn_market_replay_v0_1
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('results/yahoo_probe.json')
          x=json.loads(p.read_text())
          assert x['status']=='OK'
          assert {r['symbol'] for r in x['symbols']} == {'SPY','QQQ','GLD'}
          assert all(r['schema_ok'] and r['rows'] > 500 for r in x['symbols'])
          print(json.dumps(x,indent=2))
          PY
      - name: Commit sanitized source probe receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/ssrn_market_replay_v0_1/results/yahoo_probe.json
          if git diff --cached --quiet; then
            echo 'No probe changes'
          else
            git commit -m 'experiment: record Yahoo non-crypto source probe [skip ci]'
            git pull --rebase origin work/ssrn-market-replay-v0.1
            git push origin HEAD:work/ssrn-market-replay-v0.1
          fi
