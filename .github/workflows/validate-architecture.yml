name: validate-architecture
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_architecture.py
      - run: python scripts/validate_developer_admission.py
      - run: python scripts/validate_identity_authority.py
      - run: python scripts/validate_n_mason_pool.py
      - run: python scripts/validate_crash_safe_development.py
