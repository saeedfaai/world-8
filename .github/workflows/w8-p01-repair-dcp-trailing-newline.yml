name: W8-P01 Repair DCP Trailing Newline

on:
  push:
    branches:
      - work/w8-p01-governance-experiment-v0.1
    paths:
      - '.github/workflows/w8-p01-repair-dcp-trailing-newline.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/w8-p01-governance-experiment-v0.1

      - name: Guard exact pre-repair state
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          FILE='supabase/migrations/20260826174552_world8_development_control_plane_v1.sql'
          ACTUAL=$(sha256sum "$FILE" | awk '{print $1}')
          BYTES=$(wc -c < "$FILE")
          test "$ACTUAL" = '417216e43818d61155b4f383827a07d9ed7b93b15d4577b25383e5c6a080c05a'
          test "$BYTES" = '27992'
          echo 'guard=PASS' >> "$GITHUB_OUTPUT"

      - name: Append authoritative final newline and verify
        shell: bash
        run: |
          set -euo pipefail
          FILE='supabase/migrations/20260826174552_world8_development_control_plane_v1.sql'
          printf '\n' >> "$FILE"
          test "$(wc -c < "$FILE")" = '27993'
          echo '634d057945e8d7de6b1bdf6712f18b11109d2682760bbdd30fcda117ba93c52d  '"$FILE" | sha256sum -c -

      - name: Commit one-byte recovery repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'world8-recovery-bot'
          git config user.email 'world8-recovery-bot@users.noreply.github.com'
          git add supabase/migrations/20260826174552_world8_development_control_plane_v1.sql
          git commit -m 'recovery: restore authoritative DCP EOF newline'
          git push origin HEAD:work/w8-p01-governance-experiment-v0.1
