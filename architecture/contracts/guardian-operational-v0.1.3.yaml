contract_id: guardian-operational-contract-v0.1.3
kind: OPERATIONAL_GUARDIAN
version: '0.1.3'
status: DESIGN_FROZEN
implementation_status: NOT_IMPLEMENTED
evidence_status: NOT_EVIDENCED
deployment_status: NOT_DEPLOYED
base_contract: architecture/contracts/guardian-operational-v0.1.yaml
previous_effective_revision: architecture/contracts/guardian-operational-v0.1.2.yaml
change_request: architecture/proposals/DCR-0003-operational-guardian-leader-scope.md
effective_for_implementation: true

change_scope:
  trust_boundary_changed: false
  authority_boundary_changed: false
  leader_fencing_scope_changed: true

repairs:
  guardian_leadership_scope:
    default_scope: SOCIETY
    leader_identity:
      - world_id
      - society_id
      - guardian_shard_key
    v0_1_default_guardian_shard_key: primary
    global_single_leader_row: forbidden
    ordinary_guardian_cross_society_mutation: forbidden
    future_within_society_sharding_requires_dcr: true

  epoch_semantics:
    monotonic_within_exact_leader_identity: true
    globally_comparable_across_societies: false
    every_control_write_same_society_leader_validation: required
    stale_epoch_write: reject
    cross_society_epoch_reuse: reject
    takeover_audit_scope: SAME_LEADER_IDENTITY_ONLY
    failover_other_societies_unchanged: true

unchanged_invariants:
  guardian_is_plane_six: false
  guardian_may_create_gap: false
  guardian_may_close_gap: false
  guardian_may_evaluate_candidate_quality: false
  guardian_may_promote_candidate: false
  guardian_may_hard_revoke_authority: false
  effect_allowance_is_authorization: false
  cross_ledger_2pc: forbidden
  cross_ledger_linearizability_claim: forbidden
  society_isolation: required
  budget_accounting: S + R + A = C + O
  dispatch_slot_key_required: true
  budget_scope_identity_non_null: true

implementation_read_order:
  - architecture/contracts/guardian-operational-v0.1.yaml
  - architecture/contracts/guardian-operational-v0.1.1.yaml
  - architecture/contracts/guardian-operational-v0.1.2.yaml
  - architecture/contracts/guardian-operational-v0.1.3.yaml
  - architecture/proposals/DCR-0001-operational-guardian-dispatch-idempotency.md
  - architecture/proposals/DCR-0002-operational-guardian-budget-scope-identity.md
  - architecture/proposals/DCR-0003-operational-guardian-leader-scope.md
  - docs/engineering/guardian-operational/STATE_MACHINES_v0.1.3.md
  - docs/engineering/guardian-operational/schema/operational_guardian_schema_candidate_v0.1.3.sql
  - tests/guardian_operational/NEGATIVE_TEST_DELTA_v0.1.3.md

freeze_rule: >-
  v0.1.3 is the effective implementation/evidence revision marker for the v0.1
  design family. Further leadership/fencing identity, schema identity, trust-boundary,
  writer-authority, ledger-consistency, or accounting-invariant changes require an
  explicit Design Change Request and revision. Silent mutation is forbidden.
