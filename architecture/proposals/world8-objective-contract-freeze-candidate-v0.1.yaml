schema: WORLD8_OBJECTIVE_CONTRACT_FREEZE_CANDIDATE/0.1
candidate_id: world8-objective-contract-freeze-candidate-v0.1
status: CANDIDATE_NOT_FROZEN
canonical: false
production: false
pre_schema: true
world_id: world-001
world8_base_sha: 8022a60d06d914d25cc969f6850ed44440534c01
world9_basis: WORLD9_R0_1_OBJECTIVE_BINDING

truth_boundary:
  architecture_definition: GIT_CANONICAL
  objective_instances: CANONICAL_SPINE_REQUIRED_NOT_IMPLEMENTED
  development_surface: DCP_NON_CANONICAL
  current_development_table: public.world8_dev_objectives
  development_active_is_canonical_active: false

object_ownership:
  object: ObjectiveContractVersion
  owner_kind: WORLD8_ENTITY
  owner_key: entity_id
  immutable_after_admission: true
  principal_mutation_right: false

required_logical_fields:
  - objective_id
  - objective_version
  - entity_id
  - parent_objective_version_ref
  - objective_text_or_spec_ref
  - hard_constraints
  - authority_ceiling_ref
  - risk_policy_ref
  - observation_policy_ref
  - promotion_policy_ref
  - protected_metric_contract_refs
  - valid_time
  - jurisdiction_or_applicability_refs
  - evidence_pack_ref
  - content_digest
  - created_by_governance_actor_ref
  - promotion_decision_ref
  - created_at

authoritative_writer:
  logical_role: CanonicalSpineObjectiveContractWriter
  implementation_binding: UNBOUND_PRE_SCHEMA
  requires_promotion_authority: true
  proposer_can_write: false
  evaluator_can_write: false
  principal_can_self_write: false
  effect_executor_can_write: false

state_machine:
  canonical_states:
    - ADMITTED
    - ACTIVE
    - SUPERSEDED
    - REVOKED
  transitions:
    - from: ADMITTED
      to: ACTIVE
    - from: ACTIVE
      to: SUPERSEDED
    - from: ADMITTED
      to: REVOKED
    - from: ACTIVE
      to: REVOKED
  proposal_is_canonical_state: false
  version_payload_mutable: false

forbidden_transitions:
  - DEVELOPMENT_ACTIVE_TO_CANONICAL_ACTIVE_WITHOUT_GOVERNANCE
  - MUTATE_ADMITTED_VERSION_PAYLOAD
  - BIND_TO_MISSING_OR_DEVELOPMENT_ONLY_VERSION
  - BIND_TO_REVOKED_VERSION
  - SUPERSEDED_TO_ACTIVE_RESURRECTION
  - REVOKED_TO_ACTIVE_RESURRECTION
  - SEMANTIC_ASSESSMENT_TO_CANONICAL_ADMISSION
  - STRUCTURAL_FAIL_TO_CHILD_ACTIVATION
  - STALE_CAS_OR_FENCING_TO_CANONICAL_WRITE
  - SELF_PROMOTION_WHERE_INDEPENDENCE_REQUIRED
  - DELETE_REPLAY_REQUIRED_CANONICAL_HISTORY
  - CHANGE_GOVERNED_POLICY_WITHOUT_NEW_VERSION

objective_binding:
  canonical: true
  target_must_be_immutable_version: true
  required_fields:
    - binding_id
    - entity_id
    - principal_id
    - objective_id
    - objective_version
    - objective_content_digest
    - effective_interval
    - binding_status
    - governance_decision_ref
    - evidence_pack_ref
    - canonical_commit_ref
  direct_sources_forbidden:
    - DEVELOPMENT_OBJECTIVE_ROW
    - WORK_ORDER
    - TASK
    - SEMANTIC_ASSESSMENT
    - STRUCTURAL_CHECKER_RESULT_ALONE

refinement:
  SAFE_REFINEMENT: STRUCTURAL_PASS_PLUS_GOVERNANCE
  CONDITIONAL_REFINEMENT: STRUCTURAL_PASS_PLUS_INDEPENDENT_EVIDENCE_PLUS_GOVERNANCE
  UNKNOWN_REFINEMENT: ACTIVATION_FORBIDDEN
  semantic_can_override_structural_fail: false
  semantic_can_mint_authority: false
  protected_metrics_required_for_conditional: true

evidence_requirement:
  required_refs:
    - proposal_digest
    - parent_version_and_digest_when_applicable
    - structural_proof_and_checker_identity_when_applicable
    - protected_metric_contract_refs_and_digests
    - governance_actor_binding_for_evaluator_when_required
    - independent_evaluation_receipt_when_required
    - promotion_authority_decision_ref
    - policy_versions
    - expected_canonical_head_or_fencing_basis
    - source_refs
    - evidence_ceiling
  requester_only_evidence_for_high_risk: forbidden

recovery_behavior:
  authoritative_source: CANONICAL_SPINE_HISTORY
  development_status_authoritative: false
  reconstruct:
    - immutable_versions
    - lineage_and_status_events
    - active_objective_binding_at_canonical_point
    - admission_and_binding_governance_evidence
    - protected_metric_and_policy_refs
  verify:
    - content_digests
    - canonical_ordering
    - lineage
    - fencing_or_expected_head
  fail_closed_on:
    - missing_evidence
    - corrupt_evidence
    - broken_lineage
    - digest_mismatch
    - stale_fencing
    - ambiguous_head

world8_plane_mapping:
  CANONICAL_SPINE:
    - ObjectiveContractVersion
    - ObjectiveContractLineageEvent
    - ObjectiveBinding
  OPERATIONAL:
    - WorkOrder_consumption_of_authorized_binding
  OBSERVATION:
    - protected_metric_measurement
    - drift_degradation_breach_signal
  DEVELOPMENT_MASON:
    - objective_proposal
    - refinement_candidate
    - implementation_candidate
  EVIDENCE_GOVERNANCE:
    - evaluator_receipt
    - EvidencePack
    - PromotionAuthorityDecision
    - GovernanceActorBinding
  sixth_plane: false

enforcement_points:
  - CANONICAL_VERSION_ADMISSION
  - OBJECTIVE_BINDING_CREATE_OR_CHANGE
  - PRINCIPAL_ACTIVATION
  - REFINEMENT_PROMOTION
  - EFFECT_AND_COMMIT_PATH_OBJECTIVE_VERIFICATION
  - RECOVERY_AND_REPLAY
  - OBSERVATION_TO_GOVERNANCE_FEEDBACK

concurrency_contract:
  expected_head_or_cas_required: true
  fencing_required: true
  same_aggregate_concurrent_write: SERIALIZE_OR_STALE_FAIL
  idempotent_same_payload_replay: allowed
  idempotency_key_payload_collision: fail

freeze_exit_criteria:
  - OBJECT_OWNERSHIP_EXPLICIT
  - AUTHORITATIVE_WRITER_EXPLICIT
  - STATE_MACHINE_EXPLICIT
  - FORBIDDEN_TRANSITIONS_EXPLICIT
  - EVIDENCE_REQUIREMENT_EXPLICIT
  - RECOVERY_BEHAVIOR_EXPLICIT
  - WORLD8_PLANE_MAPPING_EXPLICIT
  - ENFORCEMENT_POINTS_EXPLICIT
  - DEVELOPMENT_CANONICAL_BOUNDARY_PRESERVED
  - INDEPENDENT_REVIEW_REQUIRED

implementation_after_freeze:
  schema_authoring_allowed_now: false
  migration_authoring_allowed_now: false
  canonical_writer_implementation_allowed_now: false
  next_after_freeze: SEPARATE_GOVERNED_SCHEMA_WRITER_IMPLEMENTATION_CANDIDATE
