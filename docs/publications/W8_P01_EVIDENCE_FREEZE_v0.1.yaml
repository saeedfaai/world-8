research_question: >-
  Can one governed multi-agent kernel preserve persistent identity, explicit authority,
  auditable evidence/effect boundaries, and recovery invariants across materially
  different Societies while remaining independent of provider/session identity?

primary_target: Autonomous Agents and Multi-Agent Systems (Springer / JAAMAS)
secondary_target: Future Generation Computer Systems (Elsevier)

claim_ceiling: >-
  World 8 is evaluated as a governed shared-kernel architecture. The frozen evidence
  supports bounded claims about persistent actor-bound authorization, fencing/lease
  boundaries, tamper-evident evidence, recovery gating, cross-Society conformance,
  and composability of the tested governance controls over AutoGen Core. It does not
  support claims of general framework superiority, production readiness, profitability,
  AGI, consciousness, or universal security.

nonclaims:
  - World 8 generally beats AutoGen, LangGraph, or other agent frameworks.
  - Leases, fencing tokens, CAS, RBAC, checkpoints, hash chains, tracing, or idempotency are novel mechanisms by themselves.
  - World 8 is production-ready.
  - World 8 is profitable or beats markets.
  - W8-P01 establishes forecasting superiority; market-performance claims belong to W8-P02.
  - The evidence establishes causal architectural superiority across arbitrary domains.
  - The evidence establishes AGI, consciousness, or autonomous economic agency.

portfolio_boundary:
