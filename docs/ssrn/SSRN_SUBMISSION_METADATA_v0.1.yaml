abstract:
  status: HOLD_UNTIL_EMPIRICAL_RESULTS
  draft: >-
    Multi-agent market systems often collapse prediction, action selection, and execution into a single agent output, making retrospective evaluation vulnerable to hidden policy changes, data leakage, and ambiguous responsibility for error. This working paper develops a testable contract-based architecture in which Forecast, Decision, and Order are distinct objects with separate lifecycles, evidence boundaries, and evaluators. Forecasts are issued against explicit targets and horizons using immutable data-cutoff and strategy/model references; decisions are evaluated separately under cost- and risk-aware expected-value rules; orders remain downstream execution artifacts subject to independent policy and portfolio vetoes. The empirical study will compare simple majority aggregation with weighted, calibrated, and correlation-controlled ensembles under deterministic historical replay, with explicit ablations for disagreement signals, regime detection, and cold-start policy. Results and performance claims are intentionally withheld until the preregistered replay, baseline, calibration, ablation, and robustness gates are completed. The released World 8 v0.1.0 artifact provides the versioned architecture and evidence boundary to which the study will be bound.

