abstract:
  status: EMPIRICAL_DRAFT_READY_FOR_MANUSCRIPT
  draft: >-
    Multi-agent market systems often collapse prediction, action selection, and execution into a single agent output, obscuring the provenance and independent evaluation of errors. This study evaluates a contract-based architecture in which Forecast, Decision, and Order are distinct objects with separate lifecycles and evidence boundaries. Under a frozen historical replay using BTCUSDT, ETHUSDT, and SOLUSDT hourly data, probability calibration consistently reduced out-of-sample Brier loss relative to equal-weight raw aggregation, with paired 24-hour moving-block bootstrap intervals below zero for all three assets. Additional ablations did not support general superiority for correlation penalties, disagreement shrinkage, regime-specific weighting, shadow cold-start, or a volatility-based decision veto; negative findings are retained. An independent daily replication on SPY, QQQ, and GLD produced calibration-improvement point estimates in the same direction, but all 95% moving-block bootstrap intervals crossed zero. The results support the usefulness of explicit probabilistic calibration and receipt-backed forecast evaluation in this fixed replay, while not supporting claims of trading profitability, production readiness, universal cross-market superiority, or autonomous market intelligence.

