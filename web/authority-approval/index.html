<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>World 8 — Authority Approval</title>
<style>body{font-family:system-ui,-apple-system,sans-serif;background:#0b1020;color:#eef2ff;margin:0}.wrap{max-width:860px;margin:auto;padding:24px}.card{background:#111827;border:1px solid #263244;border-radius:16px;padding:18px;margin:14px 0}.row{display:flex;gap:10px;flex-wrap:wrap}.grow{flex:1;min-width:220px}input{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #374151;background:#0b1220;color:#fff}button{padding:11px 14px;border:0;border-radius:10px;font-weight:700}.primary{background:#e5e7eb;color:#111827}.secondary{background:#1f2937;color:#fff;border:1px solid #374151}.muted{color:#9ca3af}.ok{color:#86efac}.warn{color:#facc15}.bad{color:#fca5a5}.hidden{display:none}.item{border:1px solid #334155;border-radius:12px;padding:12px;margin:9px 0;cursor:pointer}.mono{direction:ltr;text-align:left;font-family:ui-monospace,monospace;font-size:12px;word-break:break-all;background:#070b13;padding:9px;border-radius:8px}</style></head>
<body><div class="wrap"><h1>World 8 — Authority Approval</h1><p class="muted">Human Root · AAL2 + recent TOTP · Request → Approval → Issue</p><div id="msg" class="card hidden"></div>
<section id="login" class="card"><h3>ورود Human Root</h3><div class="row"><div class="grow"><input id="email" type="email" placeholder="ایمیل"></div><div class="grow"><input id="password" type="password" placeholder="رمز عبور"></div></div><button id="loginBtn" class="primary">ورود</button></section>
<section id="session" class="card hidden"><div id="sessionInfo"></div><div id="mfa"></div><button id="logoutBtn" class="secondary">خروج</button></section>
<section id="requests" class="card hidden"><div class="row"><div class="grow"><h3>درخواست‌های Authority</h3></div><button id="refresh" class="secondary">تازه‌سازی</button></div><div id="list"></div></section>
<section id="detail" class="card hidden"><div id="detailBody"></div><button id="approve" class="primary" disabled>تأیید Human Root و صدور Rule</button></section></div>
<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/+esm';
const URL='https://ogiqujrubsvzohqremuv.supabase.co';
const KEY='sb_publishable_7VzMz9MOj63TV3nFcYmGmA_qzRXsSVp';
const sb=createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
const $=id=>document.getElementById(id);let current=null;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function note(t,c=''){const e=$('msg');e.className='card '+c;e.textContent=t;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),5000)}
function jwt(tok){try{let s=tok.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return JSON.parse(atob(s))}catch{return{}}}
async function assurance(){const{data:{session}}=await sb.auth.getSession();if(!session)return{session:null,aal:'none',recent:false};const p=jwt(session.access_token),now=Math.floor(Date.now()/1000),ts=(p.amr||[]).filter(x=>x.method==='totp').map(x=>Number(x.timestamp||0)).sort((a,b)=>b-a)[0]||0;return{session,aal:p.aal||'aal1',recent:p.aal==='aal2'&&ts>0&&now-ts<=300&&ts<=now+30}}
async function rpc(name,args={}){const{data,error}=await sb.rpc(name,args);if(error)throw new Error(error.message);return data}
async function render(){const a=await assurance(),on=!!a.session;$('login').classList.toggle('hidden',on);$('session').classList.toggle('hidden',!on);$('requests').classList.toggle('hidden',!on);if(!on){$('detail').classList.add('hidden');return}$('sessionInfo').innerHTML='AAL: <b>'+esc(a.aal)+'</b> · TOTP تازه: <b class="'+(a.recent?'ok':'warn')+'">'+(a.recent?'بله':'خیر')+'</b>';await renderMfa(a);await load();updateApprove(a)}
async function renderMfa(a){const el=$('mfa'),{data,error}=await sb.auth.mfa.listFactors();if(error){el.textContent=error.message;return}const verified=(data?.totp||[]).filter(f=>f.status==='verified');if(a.recent){el.innerHTML='<p class="ok">Step-up معتبر است.</p>';return}if(!verified.length){el.innerHTML='<p class="warn">MFA/TOTP برای Human Root فعال نیست.</p>';return}const f=verified[0];el.innerHTML='<div class="row"><div class="grow"><input id="totp" inputmode="numeric" maxlength="8" placeholder="کد TOTP"></div><button id="totpBtn" class="primary">تأیید TOTP</button></div>';$('totpBtn').onclick=async()=>{try{const{data:c,error:e1}=await sb.auth.mfa.challenge({factorId:f.id});if(e1)throw e1;const{error:e2}=await sb.auth.mfa.verify({factorId:f.id,challengeId:c.id,code:$('totp').value.trim()});if(e2)throw e2;await render()}catch(e){note(e.message,'bad')}}}
async function load(){try{const d=await rpc('world8_authority_rule_pending_v1'),items=d?.items||[];$('list').innerHTML=items.length?items.map(x=>'<div class="item" data-id="'+esc(x.request_id)+'"><b>'+esc(x.action)+' → '+esc(x.resource_ref)+'</b><div class="muted">'+esc(x.subject_ref)+' · '+esc(x.request_id)+'</div></div>').join(''):'<p class="muted">درخواست فعالی وجود ندارد.</p>';$('list').querySelectorAll('.item').forEach(n=>n.onclick=()=>openReq(n.dataset.id))}catch(e){$('list').innerHTML='<p class="bad">'+esc(e.message)+'</p>'}}
async function openReq(id){try{current=await rpc('world8_authority_rule_get_v1',{p_request_id:id});$('detail').classList.remove('hidden');$('detailBody').innerHTML='<p><b>Request:</b> '+esc(current.request_id)+'</p><p><b>Actor:</b> '+esc(current.subject_ref)+'</p><p><b>Action:</b> '+esc(current.action)+'</p><p><b>Resource:</b> '+esc(current.resource_ref)+'</p><div class="mono">'+esc(JSON.stringify(current.scope))+'</div>';updateApprove(await assurance())}catch(e){note(e.message,'bad')}}
function updateApprove(a){$('approve').disabled=!(current&&current.status==='REQUESTED'&&current.challenge_token&&a.recent)}
$('loginBtn').onclick=async()=>{try{const{error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;$('password').value='';await render()}catch(e){note(e.message,'bad')}};
$('logoutBtn').onclick=async()=>{await sb.auth.signOut();current=null;await render()};$('refresh').onclick=load;
$('approve').onclick=async()=>{try{if(!current)return;await rpc('world8_authority_rule_ceremony_v1',{p_challenge_id:current.challenge_id,p_challenge_token:current.challenge_token});note('Rule با تأیید Human Root صادر شد.','ok');current=null;$('detail').classList.add('hidden');await load()}catch(e){note(e.message,'bad')}};
sb.auth.onAuthStateChange(()=>setTimeout(render,0));render();
</script></body></html>
